<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <script>
    window.NEWS_API_KEY = window.NEWS_API_KEY || "{{ NEWS_API_KEY }}";
  </script>
  <title>Analysis Result | TruthGuard</title>

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/result.css" />

  <script defer src="js/theme.js"></script>
  <script src="js/newsApi.js"></script>
  <script defer src="js/result.js"></script>
</head>
<body>

<header class="navbar">
  <div class="logo">
    <span class="logo-icon">T</span>
    <span class="logo-text">TruthGuard</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="analyze.html">Analyze</a>
    <a href="sources.html">Sources</a>
    <a href="similar.html">Similar News</a>
  </nav>

  <button id="themeToggle" class="theme-toggle">🌙</button>
</header>

<section class="result-section">

  <div class="result-card">

    <h1>Credibility Analysis</h1>

    <h3 id="resultTitle" class="result-title">
      News Title Appears Here
    </h3>

    <div class="score-wrapper">
      <svg class="score-ring" width="160" height="160">
        <circle cx="80" cy="80" r="70" />
        <circle cx="80" cy="80" r="70" id="progressCircle" />
      </svg>

      <div class="score-text">
        <span id="score">0%</span>
      </div>
    </div>

    <p id="verdict" class="verdict">
      Analyzing...
    </p>

    <ul id="reasons" class="reason-list">
    </ul>

    <div class="result-actions">
      <a href="analyze.html" class="primary-btn">
        Analyze Another News
      </a>

      <a href="similar.html" class="secondary-btn">
        View Similar News
      </a>
    </div>

  </div>

</section>

<footer class="footer">
  © 2026 TruthGuard · Transparent credibility analysis
</footer>

</body>
</html>
